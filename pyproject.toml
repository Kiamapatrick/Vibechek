[project]
name = "vibeshield"
version = "1.0.0"
description = "Security scanner for AI-assisted/vibe-coded web apps"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "VibeShield Contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "typer[all]>=0.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "rich>=13.7",
    "tenacity>=8.2",
    "packaging>=23.2",
    "groq>=0.11",
    "pydantic-settings>=2.5",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests>=2.31",
    "respx>=0.21",
    "rank_bm25>=0.2",
    "scipy>=1.10",
    "mongomock-motor>=0.0.36",
]
backend = [
    "fastapi>=0.115",
    "motor>=3.6",
    "pymongo>=4.9",
    "sse-starlette>=2.1",
]
[project.scripts]
vibeshield = "vibeshield.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.typer]
rich-markup-mode = "rich"
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "scipy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
